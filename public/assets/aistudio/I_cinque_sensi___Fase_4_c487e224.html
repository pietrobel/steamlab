@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1d1b2e;--ink:#f5f5f5;--card:#2a2740}}
:root[data-theme="dark"]{--bg:#1d1b2e;--ink:#f5f5f5;--card:#2a2740}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:16px;text-align:center}
h1{font-size:clamp(28px,6vw,48px);margin:8px 0}
.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
button{font:inherit;border:0;border-radius:20px;cursor:pointer;min-height:56px;padding:12px 18px;font-weight:700;color:#fff;background:var(--p5)}
button.ghost{background:var(--card);color:var(--ink)}
button:focus-visible{outline:3px solid var(--p3)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:18px 0}
.sense{height:clamp(120px,22vw,160px);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:16px;color:var(--ink)}
.sense .e,.organo .e,.ex .e,.opz .e{font-size:44px}
.organo{width:100%;max-width:420px;margin:12px auto;display:flex;flex-direction:column;align-items:center;color:var(--ink);font-size:20px}
.bar{height:16px;border-radius:8px;background:var(--card);overflow:hidden;margin:8px auto;max-width:420px}
.bar div{height:100%;background:var(--p4);transition:width .4s}
.card{background:var(--card);border-radius:24px;padding:20px;margin:16px auto;font-size:20px;line-height:1.5;max-width:640px}
.scheda h2{margin:4px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:12px}
.ex{background:var(--bg);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;font-size:18px}
.viso{max-width:100%;height:auto;margin:8px auto;display:block}
.viso [role=button]:focus{outline:3px solid var(--p3)}
.ascolta{background:var(--p4);color:var(--ink);margin:8px 0}
.nota{font-size:16px;opacity:.7}
.play{background:var(--p3);color:var(--ink);font-size:24px;padding:18px 36px}
.opzioni{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px auto;max-width:700px}
.opz{background:var(--card);color:var(--ink);font-size:20px;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.opz.grande{font-size:28px;min-height:120px}
.emoji-grande{font-size:96px;margin:8px 0}
.esito{font-size:22px;font-weight:700;margin:12px auto;max-width:640px;min-height:40px}
.esito.ok{color:var(--ok)}
.esito.ko{color:var(--ko)}
</style>

function lodi(p){
  const n=p.nome, F=p.sesso==="F";
  const frasi=[
    "Complimenti "+n+", "+(F?"bravissima":"bravissimo")+"!",
    "Esatto, "+n+"!",
    "Ottimo lavoro, "+n+"!",
    "Hai capito, "+n+", "+(F?"brava":"bravo")+"!"

function mescola(a){return [...a].sort(()=>Math.random()-0.5);}

// Sintesi vocale: solo browser, nessuna API esterna
const Voce={
  ok:typeof window!=="undefined" && "speechSynthesis" in window && "SpeechSynthesisUtterance" in window,
  ultimo:"",
  voce(){
    const vs=speechSynthesis.getVoices();
    return vs.find(v=>/^it/i.test(v.lang) && /natural|neural|enhanced|premium/i.test(v.name))
        || vs.find(v=>/^it/i.test(v.lang)) || null;
  },
  parla(testo,onFine){
    this.ultimo=testo;
    const fine=()=>{ if(onFine){ const f=onFine; onFine=null; f(); } };
    if(!this.ok){ if(onFine) setTimeout(fine,1500); return; }
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(testo);
    u.lang="it-IT"; u.rate=0.85; u.pitch=1.1;
    u.onend=fine; u.onerror=fine;
    const v=this.voce(); if(v) u.voice=v;
    speechSynthesis.speak(u);
  }
};

function Ascolta({testo,etichetta}){
  if(!Voce.ok) return h("p",{className:"nota"},"Audio non disponibile su questo dispositivo. Il testo è scritto qui sopra.");
  return h("button",{className:"ascolta",onClick:()=>Voce.parla(testo)},"🔊 "+(etichetta||"ASCOLTA"));

    h(Ascolta,{testo:testo,etichetta:"ASCOLTA LA SPIEGAZIONE"}),
    h("div",{className:"grid2"},
      s.esempi.map((e,i)=>h("div",{key:i,className:"ex"},h("span",{className:"e","aria-hidden":true},e[0]),h("span",null,e[1])))
    )
  );
}

// Costruisce una domanda per il gioco "tipo" a partire da un elemento della banca
function domanda(tipo,it){
  const sen=SENSI.find(x=>x.id===it.s);
  const sug=sen?sen.funzione:"Qui usiamo più sensi insieme.";
  if(tipo==="indovina") return {titolo:"Guarda l'immagine: quale senso usiamo?",emoji:it.e,opz:SENSI.map(s=>({label:s.nome,val:s.id,icona:s.id})),cor:it.s,sug,voce:"Quale senso usiamo?"};
  if(tipo==="organo") return {titolo:"Quale organo usiamo?",testo:it.t,opz:SENSI.map(s=>({label:s.organo,val:s.id,icona:s.id})),cor:it.s,sug,voce:it.t+" Quale organo usiamo?"};
  if(tipo==="associa"){
    const altri=mescola(ITEMS.filter(x=>x.s!==it.s && x.s!=="tutti")).slice(0,3).map(x=>({val:x.e,e:x.e}));
    return {titolo:"Quale immagine va con "+sen.organo+"?",opz:mescola([{val:it.e,e:it.e},...altri]),cor:it.e,sug,voce:"Quale immagine va con "+sen.organo+"?"};
  }
  if(tipo==="percepisco") return {titolo:"Quali sensi usiamo?",testo:it.t,opz:SENSI.map(s=>({label:s.nome,val:s.id,icona:s.id})),cor:it.c||[it.s],multi:true,sug,voce:it.t+" Quali sensi usiamo?"};
  // vero o falso
  const vero=Math.random()<0.5;
  const affermato=vero?sen:mescola(SENSI.filter(x=>x.id!==it.s))[0];
  return {titolo:"Vero o falso?",testo:it.t+" Per questo usiamo il senso: "+affermato.nome+".",opz:[{label:"VERO",val:"V",e:"✅"},{label:"FALSO",val:"F",e:"❌"}],cor:vero?"V":"F",sug,voce:it.t+" Per questo usiamo il senso "+affermato.nome+". Vero o falso?"};
}

// Pesca n domande alternando i sensi, così non compaiono tutte le domande di un senso di seguito
function pesca(lista,n){
  const gruppi={};
  mescola(lista).forEach(q=>{const k=q.grp||q.cor;(gruppi[k]=gruppi[k]||[]).push(q);});
  const out=[];
  while(out.length<n && Object.keys(gruppi).some(k=>gruppi[k].length)){
    mescola(Object.keys(gruppi)).forEach(k=>{
      if(out.length<n && gruppi[k].length) out.push(gruppi[k].pop());
    });
  }
  return out;
}

function costruisci(tipo){
  if(tipo==="associa"){
    const tutte=[];
    ASSOCIA.forEach(a=>{
      const sen=SENSI.find(x=>x.id===a.g);
      a.s.forEach(c=>{
        tutte.push({titolo:a.t,opz:mescola([c,...mescola(a.d).slice(0,3)]).map(e=>({val:e,e:e})),cor:c,grp:a.g,sug:sen.funzione,voce:a.t});
      });
    });
    return pesca(tutte,15);
  }
  if(tipo==="indovina"){
    const tutte=INDOVINA.flatMap(([e,azioni])=>azioni.map(([senso,azione])=>{
      const dom="Guarda l'immagine. Quale senso usiamo "+azione+"?";
      return {titolo:dom,emoji:e,opz:SENSI.map(x=>({label:x.nome,val:x.id,icona:x.id})),cor:senso,sug:SENSI.find(x=>x.id===senso).funzione,voce:dom};
    }));
    return pesca(tutte,15);
  }
  const base=tipo==="percepisco"?ITEMS:ITEMS.filter(i=>i.s!=="tutti");
  return pesca(base.map(it=>domanda(tipo,it)),15);
}

function Gioco({tipo,onEsci,onMenu,profilo}){
  const [deck,setDeck]=useState(()=>costruisci(tipo));
  const [i,setI]=useState(0);
  const [esito,setEsito]=useState(null);
  const [giuste,setGiuste]=useState(0);
  const [sbagliate,setSbagliate]=useState([]);
  const [scelte,setScelte]=useState([]);
  const q=deck[i];
  const multi=!!q && Array.isArray(q.cor);
  const corretti=multi?q.cor:(q?[q.cor]:[]);
  const chiusa=!!(esito&&(esito.ok||esito.rivelata));
  useEffect(()=>{
    if(!q) return;
    const t=setTimeout(()=>Voce.parla(q.voce),300);
    return ()=>clearTimeout(t);
  },[i,deck]);

  function avanzaDopo(){ setEsito(null); setSbagliate([]); setScelte([]); setI(x=>x+1); }
  function vinci(){
    const msg=lodi(profilo);
    setEsito({ok:true,msg}); setGiuste(g=>g+1); Voce.parla(msg,avanzaDopo);
  }
  function sbaglia(){
    if(sbagliate.length+1>=2){
      let msg;
      if(multi){
        msg="La risposta giusta è: "+corretti.map(v=>SENSI.find(x=>x.id===v).nome).join(", ")+".";
      }else{
        const giusta=q.opz.find(o=>o.val===q.cor);
        msg=giusta&&giusta.label?"La risposta giusta è: "+giusta.label+".":"La risposta giusta è quella evidenziata in verde.";
      }
      setEsito({ok:false,rivelata:true,msg}); Voce.parla(msg);
    }else{
      const msg="Quasi! Riprova. Suggerimento: "+q.sug;
      setEsito({ok:false,msg}); Voce.parla(msg);
    }
  }
  function scegli(val){
    if(chiusa) return;
    if(multi){
      if(scelte.includes(val)){ setScelte(s=>s.filter(x=>x!==val)); return; }
      if(!corretti.includes(val)){ setSbagliate(n=>[...n,val]); sbaglia(); return; }
      const nuove=[...scelte,val];
      setScelte(nuove);
      if(corretti.every(c=>nuove.includes(c))){ vinci(); }
      else {
        const msg="Bene! E poi quale altro senso utilizzi?";
        setEsito({parziale:true,msg}); Voce.parla(msg);
      }
      return;
    }
    if(val===q.cor){ vinci(); }
    else { setSbagliate(n=>[...n,val]); sbaglia(); }
  }
  function verifica(){
    if(chiusa) return;
    const giusto=scelte.length===corretti.length && corretti.every(c=>scelte.includes(c));
    if(giusto){ vinci(); }
    else { setSbagliate(n=>[...n,"x"]); sbaglia(); }
  }
  function avanti(){ setEsito(null); setSbagliate([]); setScelte([]); setI(x=>x+1); }
  function ricomincia(){ setDeck(costruisci(tipo)); setI(0); setEsito(null); setGiuste(0); setSbagliate([]); setScelte([]); }

  if(i>=deck.length){
    return h("div",{className:"card"},
      h("h2",null,"Hai completato il gioco! 🎉"),
      h("p",null,"Risposte giuste: "+giuste+" su "+deck.length),
      h("div",{className:"top",style:{justifyContent:"center"}},
        h("button",{onClick:ricomincia},"RICOMINCIA"),
        h("button",{className:"ghost",onClick:onEsci},"ALTRI GIOCHI"),
        h("button",{className:"play",onClick:onMenu},"MENU INIZIALE")
      )
    );
  }

  const opzioni=q.opz.map((o,k)=>{
    const vero=tipo==="vero";
    const base=vero?{background:o.val==="V"?"#06d6a0":"#ff8fa3"}:{};
    const sel=multi&&scelte.includes(o.val)&&!chiusa;
    const giustaVisibile=chiusa&&corretti.includes(o.val);
    const st=Object.assign({},base,
      giustaVisibile?{outline:"6px solid #06d6a0"}:{},
      sel?{outline:"6px solid #8ecae6"}:{},
      (!chiusa&&sbagliate.includes(o.val))?{opacity:.4}:{});
    return h("button",{key:k,className:"opz"+(vero?" grande":""),style:st,"aria-pressed":multi?sel:undefined,onClick:()=>scegli(o.val)},
      o.icona&&h("span",{className:"e","aria-hidden":true},h(Icona,{id:o.icona,size:70})),
      o.e&&h("span",{className:"e","aria-hidden":true},o.e),
      o.label&&h("span",null,o.label));
  });

  return h("div",null,
    h("p",null,"Domanda "+(i+1)+" di "+deck.length),
    h("h2",null,q.titolo),
    q.testo&&h("div",{className:"card"},q.testo),
    h("div",null,h(Ascolta,{testo:q.voce,etichetta:"ASCOLTA LA DOMANDA"})),
    q.emoji&&h("div",{className:"emoji-grande","aria-hidden":true},q.emoji),
    h("div",{className:"opzioni"},opzioni),
    esito&&h("p",{className:"esito "+(esito.ok||esito.parziale?"ok":"ko"),role:"status","aria-live":"polite"},esito.msg),
    esito&&esito.rivelata&&h("button",{className:"play",onClick:avanti},i+1<deck.length?"AVANTI":"FINE")
  );
}

function Benvenuto({profilo,onSalva}){
  const [nome,setNome]=useState(profilo?profilo.nome:"");
  const [sesso,setSesso]=useState(profilo?profilo.sesso:null);
  const pronto=nome.trim().length>0 && !!sesso;
  const sc=(v)=>sesso===v?{outline:"6px solid #2b2d42"}:{};
  return h("div",{className:"wrap"},
    h("h1",null,"CHI GIOCA?"),
    h("input",{type:"text",value:nome,placeholder:"Scrivi il tuo nome",onChange:e=>setNome(e.target.value),"aria-label":"Nome",
      style:{fontSize:"24px",padding:"14px",borderRadius:"16px",border:"2px solid var(--ink)",width:"100%",maxWidth:"420px",margin:"12px auto",display:"block",background:"var(--card)",color:"var(--ink)"}}),
    h("p",null,"Scegli:"),
    h("div",{className:"grid"},
      h("button",{className:"sense",style:Object.assign({background:"#8ecae6"},sc("M")),onClick:()=>setSesso("M"),"aria-pressed":sesso==="M"},
        h("span",{className:"e","aria-hidden":true},"👦"),"ALUNNO"),
      h("button",{className:"sense",style:Object.assign({background:"#ffb3c6"},sc("F")),onClick:()=>setSesso("F"),"aria-pressed":sesso==="F"},
        h("span",{className:"e","aria-hidden":true},"👧"),"ALUNNA")
    ),
    h("button",{className:"play",disabled:!pronto,style:{opacity:pronto?1:.5},
      onClick:()=>{if(pronto) onSalva({nome:nome.trim(),sesso:sesso});}},"INIZIA")
  );
}

function App(){
  const [schermo,setSchermo]=useState("home");
  const [gioco,setGioco]=useState(null);
  const [dettaglio,setDettaglio]=useState(null);
  const [modifica,setModifica]=useState(false);
  const [profilo,setProfilo]=useState(()=>{
    try{return JSON.parse(localStorage.getItem("cinque-sensi-profilo")||"null");}catch(e){return null;}
  });
  function salvaProfilo(p){
    try{localStorage.setItem("cinque-sensi-profilo",JSON.stringify(p));}catch(e){}
    setProfilo(p); setModifica(false);
  }
  const [visti,setVisti]=useState(()=>{
    try{return JSON.parse(localStorage.getItem("cinque-sensi-visti")||"[]");}catch(e){return [];}
  });
  useEffect(()=>{
    try{localStorage.setItem("cinque-sensi-visti",JSON.stringify(visti));}catch(e){}
  },[visti]);

  const pct=Math.round(visti.length/SENSI.length*100);
  const sensoAttuale=SENSI.find(s=>s.id===schermo);
  const sensoDettaglio=SENSI.find(s=>s.id===dettaglio);

  function apri(id){
    setVisti(v=>v.includes(id)?v:[...v,id]);
    setDettaglio(null); setGioco(null); setSchermo(id);
  }
  function vai(s){ setDettaglio(null); setGioco(null); setSchermo(s); }

  const nav=(indietro)=>h("div",{className:"top"},
    h("button",{className:"ghost",onClick:indietro||(()=>vai("home"))},"← Indietro"),
    Voce.ok && h("button",{className:"ghost",onClick:()=>Voce.parla(Voce.ultimo||ISTRUZIONI)},"🔁 RIPETI"),
    h("button",{className:"ghost",onClick:()=>vai("home")},"🏠 HOME")
  );

  const zona=(id,label,figli)=>h("g",{key:id,role:"button",tabIndex:0,"aria-label":label,style:{cursor:"pointer"},
    onClick:()=>setDettaglio(id),
    onKeyDown:e=>{if(e.key==="Enter"||e.key===" ")setDettaglio(id);}},figli);

  if(!profilo||modifica){
    return h(Benvenuto,{profilo:profilo,onSalva:salvaProfilo});
  }

  if(schermo==="volto"){
    return h("div",{className:"wrap"},
      nav(),
      h("h1",null,"IL VISO"),
      h("p",null,"Tocca una parte del viso."),
      h("svg",{className:"viso",viewBox:"0 0 240 260",width:240,height:260,role:"group","aria-label":"Volto"},
        h("ellipse",{cx:120,cy:130,rx:95,ry:110,fill:"#ffd7a8"}),
        zona("udito","Orecchie",[
          h("ellipse",{key:"o1",cx:24,cy:130,rx:14,ry:24,fill:"#ffb98a",stroke:"#2b2d42",strokeWidth:3}),
          h("ellipse",{key:"o2",cx:216,cy:130,rx:14,ry:24,fill:"#ffb98a",stroke:"#2b2d42",strokeWidth:3})
        ]),
        zona("vista","Occhi",[
          h("circle",{key:"e1",cx:85,cy:110,r:16,fill:"#fff",stroke:"#2b2d42",strokeWidth:3}),
          h("circle",{key:"e2",cx:155,cy:110,r:16,fill:"#fff",stroke:"#2b2d42",strokeWidth:3}),
          h("circle",{key:"p1",cx:88,cy:112,r:7,fill:"#2b2d42"}),
          h("circle",{key:"p2",cx:158,cy:112,r:7,fill:"#2b2d42"})
        ]),
        zona("olfatto","Naso",[
          h("path",{key:"n",d:"M120 130 L108 165 L132 165",fill:"none",stroke:"#2b2d42",strokeWidth:4,strokeLinejoin:"round"})
        ]),
        zona("gusto","Bocca e lingua",[
          h("path",{key:"b",d:"M90 195 Q120 222 150 195",stroke:"#2b2d42",strokeWidth:8,fill:"none",strokeLinecap:"round"}),
          h("ellipse",{key:"l",cx:120,cy:204,rx:12,ry:6,fill:"#ff6b8a"})
        ])
      ),
      sensoDettaglio && h(Scheda,{s:sensoDettaglio})
    );
  }

  if(sensoAttuale){
    return h("div",{className:"wrap"},
      nav(),
      h("h1",null,sensoAttuale.nome),
      h("button",{className:"organo",style:{background:sensoAttuale.colore},
        onClick:()=>setDettaglio(d=>d===sensoAttuale.id?null:sensoAttuale.id),
        "aria-expanded":dettaglio===sensoAttuale.id},
        h("span",{className:"e","aria-hidden":true},sensoAttuale.emoji),
        sensoAttuale.organo),
      dettaglio===sensoAttuale.id && h(Scheda,{s:sensoAttuale})
    );
  }

  if(schermo==="giochi"){
    if(gioco){
      const g=GIOCHI.find(x=>x.id===gioco);
      return h("div",{className:"wrap"},
        nav(()=>setGioco(null)),
        h("h1",null,g.nome),
        h(Gioco,{key:gioco,tipo:gioco,profilo:profilo,onEsci:()=>setGioco(null),onMenu:()=>vai("home")})
      );
    }
    return h("div",{className:"wrap"},
      nav(),
      h("h1",null,"GIOCHIAMO"),
      h("div",{className:"grid"},
        GIOCHI.map(g=>h(Pulsante,{key:g.id,nome:g.nome,emoji:g.emoji,colore:g.colore,onClick:()=>setGioco(g.id)}))
      )
    );
  }

  return h("div",{className:"wrap"},
    h("h1",null,"I CINQUE SENSI"),
    h("p",null,"Ciao "+profilo.nome+"!"),
    h("button",{className:"ghost",onClick:()=>setModifica(true)},"CAMBIA ALUNNO"),
    h(Bimbo),
    h("div",{className:"grid"},
      SENSI.map(s=>h(Pulsante,{key:s.id,nome:s.nome,emoji:s.emoji,colore:s.colore,onClick:()=>apri(s.id)}))

    h("div",{className:"top",style:{justifyContent:"center"}},
      h("button",{className:"ghost",onClick:()=>vai("volto")},"👤 IL VISO"),
      h("button",{className:"play",onClick:()=>vai("giochi")},"GIOCHIAMO")
    ),
    h("div",{style:{margin:"16px 0"}},
      h(Ascolta,{testo:ISTRUZIONI,etichetta:"ASCOLTA LE ISTRUZIONI"})
    ),
    h("p",null,"Sensi esplorati: "+visti.length+" / "+SENSI.length),
    h("div",{className:"bar",role:"progressbar","aria-valuenow":pct,"aria-valuemin":0,"aria-valuemax":100,"aria-label":"Progressi"},
      h("div",{style:{width:pct+"%"}}))
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
